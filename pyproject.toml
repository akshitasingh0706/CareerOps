[project]
name = "careerops"
version = "0.1.0"
description = "Job search operations: discovery, fit scoring, grounded resume tailoring, and application tracking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "anthropic>=0.40",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "respx>=0.21"]
local-embeddings = ["fastembed>=0.3"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
queue = ["redis>=5.0"]
observability = ["langfuse>=3.0"]
browser = ["playwright>=1.45"]
all = [
  "fastembed>=0.3",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "langfuse>=3.0",
  "playwright>=1.45",
]

[project.scripts]
careerops = "careerops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network or LLM APIs, skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
